apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-portal
      color: blue
  template:
    metadata:
      labels:
        app: hospital-portal
        color: blue
    spec:
      containers:
        - name: hospital-portal
          image: dhan01/hospital-appointment-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-portal
      color: green
  template:
    metadata:
      labels:
        app: hospital-portal
        color: green
    spec:
      containers:
        - name: hospital-portal
          image: dhan01/hospital-appointment-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-portal-service
spec:
  type: NodePort
  selector:
    app: hospital-portal
    color: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30016
